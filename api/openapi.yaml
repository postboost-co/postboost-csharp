        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Schedule post
      tags:
      - Posts
  /{workspaceUuid}/posts/add-to-queue/{postUuid}:
    post:
      description: |
