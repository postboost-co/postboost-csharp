            `expired`, `unknown` (refreshed automatically, no known hard limit) or `none` (the
            network's connections do not expire on a schedule).
          enum:
          - access
          - refresh
          - expired
          - unknown
          - none
          type: string
        expires_at:
          description: When the connection stops working unless reconnected; null
            without a hard expiry.
          format: date-time
          nullable: true
          type: string
        days_left:
          description: Whole days until `expires_at` (0 = less than a day).
          nullable: true
          type: integer
        refreshable:
          description: PostBoost refreshes the token automatically until the hard
            expiry.
          type: boolean
        note:
          description: Plain-language explanation of the prediction.
