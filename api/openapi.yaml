openapi: 3.1.0
info:
  contact:
    email: hi@postboost.co
    name: PostBoost Support
    url: https://postboost.co
  description: |
    The PostBoost REST API lets you publish, schedule, and analyze social media posts
    on every supported network from a single integration. No OAuth apps to maintain —
    PostBoost handles platform authorization for you.

    ## Base URL
    All workspace-scoped endpoints are prefixed with `/{workspaceUuid}`.
    Panel/admin endpoints are prefixed with `/panel`.

    ## Plan access
    Every workspace-scoped endpoint returns `403` when the workspace's plan does not
    include API access (capability `api`).

    ## Dates and times
    Post dates and times (`date`, `time`, `accounts_schedule`) are read in the request's
    `timezone` when one is given, otherwise in the workspace timezone.

    ## Idempotent requests
    Send an `Idempotency-Key` header (any unique string, for example a UUID) with a `POST`.
    Repeating the request with the same key within 24 hours returns the stored response with
    `Idempotent-Replayed: true` and creates nothing new. Reusing a key with a different body
    returns `422`; a request still in progress with the same key returns `409`.
    `5xx` and `429` responses are not stored, so they can be retried with the same key.

    ## Guardrails for automated clients
    Create and update requests are checked before anything is written: a post whose content
    matches one created for the same account in the last 24 hours returns `409`
    (`code: duplicate_post`, override with `allow_duplicate: true`), scheduling past an account's
    daily cap returns `429` (`code: account_daily_cap_reached`), and scheduling to an account that
    must be reconnected returns `422` (`code: account_unauthorized` or `account_token_missing`).
    Use `POST /{workspaceUuid}/posts/validate` for a dry run and `GET /{workspaceUuid}/activity`
    to review what API clients did.

    ## Authentication
    All requests require a Bearer token in the `Authorization` header.
    Generate tokens in your PostBoost dashboard under **Settings → Access Tokens**.

    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```
  license:
    name: Commercial
    url: https://postboost.co/pages/terms
  title: PostBoost API
  version: 1.57.8
servers:
- description: Production
  url: https://postboost.co/app/api
security:
- bearerAuth: []
tags:
- description: Social media accounts connected to a workspace.
  name: Accounts
- description: Upload and manage media assets in the workspace library.
  name: Media
- description: Organize posts with color-coded tags.
  name: Tags
- description: "Create, schedule, and publish posts across platforms."
  name: Posts
- description: "Workspace, account, and post analytics, plus best posting times."
  name: Analytics
- description: "The workspace mention book. Reference a mention in a post body with\
    \ `{{mention:<reference>}}`."
  name: Mentions
- description: Workspaces. `GET /workspaces` lists the caller's own workspaces; `/panel/workspaces`
    endpoints are admin only.
  name: Workspaces
- description: Manage workspace subscriptions and billing (admin only).
  name: Subscriptions
- description: Manage users across the platform (admin only).
  name: Users
- description: Manage billing receipts (admin only).
  name: Receipts
- description: Log of the write requests API clients made in a workspace.
  name: Activity
- description: AI-powered content generation tools. Each generation call counts against
    the workspace AI credit limit.
  name: AI
- description: Background agents that check the workspace on a schedule and propose
    changes for a person to approve.
  name: Agents
- description: "REST-hook subscriptions so automation tools (n8n, Zapier, Make) can\
    \ register their own webhook triggers."
  name: Webhooks
- description: "Free social media tools (character counter, thread maker, UTM builder\
    \ and more), the same logic as https://postboost.co/tools. No account needed:\
    \ call them without a token, or with any API token. The AI tools need a token\
    \ and spend AI credits."
  name: Free Tools
paths:
  /workspaces:
    get:
      description: "Returns the workspaces the authenticated user belongs to, most\
        \ recently updated first, with the caller's role in each. Use a returned `uuid`\
        \ as `workspaceUuid`."
      operationId: listMyWorkspaces
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listMyWorkspaces_200_response'
          description: The caller's workspaces
        "401":
          $ref: '#/components/responses/Unauthorized'
      summary: List my workspaces
      tags:
      - Workspaces
  /{workspaceUuid}/accounts:
    get:
      description: "Returns all social media accounts connected to the workspace,\
        \ newest first. Optional filters narrow the list."
      operationId: listAccounts
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: Match the account name or username.
        explode: true
        in: query
        name: keyword
        required: false
        schema:
          type: string
        style: form
      - description: Only accounts in this account group.
        explode: true
        in: query
        name: group
        required: false
        schema:
          type: string
        style: form
      - description: "Only accounts of these providers (for example `instagram`, `linkedin`)."
        explode: true
        in: query
        name: "providers[]"
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "When `true`, only accounts that need to be reconnected."
        explode: true
        in: query
        name: unauthorized
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listAccounts_200_response'
          description: List of accounts
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List accounts
      tags:
      - Accounts
  /{workspaceUuid}/accounts/{accountUuid}:
    get:
      description: Returns a single social media account.
      operationId: getAccount
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/accountUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: Account details
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get account
      tags:
      - Accounts
  /{workspaceUuid}/analytics:
    get:
      description: "Cross-platform summary (followers, growth, posts, leaderboard,\
        \ posting streak) over every account that supports analytics, for a preset\
        \ period or a custom date range."
      operationId: getAnalyticsSummary
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/analyticsPeriod'
      - $ref: '#/components/parameters/analyticsDateFrom'
      - $ref: '#/components/parameters/analyticsDateTo'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: Analytics summary
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Get analytics summary
      tags:
      - Analytics
  /{workspaceUuid}/analytics/accounts/{accountUuid}:
    get:
      description: Analytics for one account. `type` selects one of the tabs the account
        supports (listed in `tabs` of the response); returns `422` when the account
        does not support analytics.
      operationId: getAccountAnalytics
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/accountUuid'
      - $ref: '#/components/parameters/analyticsPeriod'
      - $ref: '#/components/parameters/analyticsDateFrom'
      - $ref: '#/components/parameters/analyticsDateTo'
      - description: Analytics tab. Defaults to the account's default tab.
        explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - description: Page for list-style tabs (for example per-post metrics).
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          maximum: 50
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: sort_by
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - explode: true
        in: query
        name: sort_dir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAnalytics'
          description: Account analytics
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Get account analytics
      tags:
      - Analytics
  /{workspaceUuid}/analytics/posting-times:
    get:
      description: "Engagement scores per weekday and hour, merged across the given\
        \ accounts (all accounts when none is given), in the requested timezone. Also\
        \ returns up to three recommended slots."
      operationId: getPostingTimes
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: Account UUIDs. Defaults to every account in the workspace.
        explode: true
        in: query
        name: "accounts[]"
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      - description: Timezone the grid is expressed in. Defaults to the workspace
          timezone.
        explode: true
        in: query
        name: timezone
        required: false
        schema:
          example: Europe/Istanbul
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingTimes'
          description: Posting times
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Get posting times heatmap
      tags:
      - Analytics
  /{workspaceUuid}/analytics/best-times:
    get:
      description: "The next recommended date and time per account, on or after `from`\
        \ (never in the past), within the next 14 days."
      operationId: getBestPostingTimes
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: Account UUIDs. Defaults to every account in the workspace.
        explode: true
        in: query
        name: "accounts[]"
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      - description: Earliest date to recommend (Y-m-d). Defaults to now.
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Timezone for `from` and the returned times. Defaults to the workspace
          timezone.
        explode: true
        in: query
        name: timezone
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestPostingTimes'
          description: Best posting times
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Get best posting times
      tags:
      - Analytics
  /{workspaceUuid}/media:
    delete:
      description: "Delete one or more media items by their numeric IDs or UUIDs (both\
        \ may be mixed, up to 500 per request)."
      operationId: deleteMediaBulk
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteMediaBulk_request'
        required: true
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Delete media (bulk)
      tags:
      - Media
    get:
      description: |
        Returns a paginated list of media assets in the workspace library. Without `folder`
        every item is listed, whatever folder it is filed in. A `keyword` search always looks at
        the whole library and ignores `folder` and `favorite`.
      operationId: listMedia
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: Page number.
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: Items per page. Values below 1 fall back to 50; values above
          100 are capped at 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          type: integer
        style: form
      - description: "Media folder UUID, or `root` for items not filed in any folder."
        explode: true
        in: query
        name: folder
        required: false
        schema:
          type: string
        style: form
      - description: Only these MIME types (for example `image/png`).
        explode: true
        in: query
        name: "mime_types[]"
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Only this media type.
        explode: true
        in: query
        name: type
        required: false
        schema:
          enum:
          - image
          - gif
          - video
          type: string
        style: form
      - description: Search media by name.
        explode: true
        in: query
        name: keyword
        required: false
        schema:
          type: string
        style: form
      - description: Filter by how the media is used in posts.
        explode: true
        in: query
        name: usage
        required: false
        schema:
          enum:
          - unused
          - draft
          - scheduled
          - published
          type: string
        style: form
      - description: "When `true`, only media the caller marked as favorite."
        explode: true
        in: query
        name: favorite
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: newest
          enum:
          - newest
          - oldest
          - name
          - size
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listMedia_200_response'
          description: Paginated list of media
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List media
      tags:
      - Media
    post:
      description: |
        Upload a file directly as multipart form data. Images and videos, plus a PDF (up to 100 MB)
        for LinkedIn document posts: a post that attaches a PDF must have it as the only media item
        and may only go to LinkedIn profiles and pages.
      operationId: uploadMedia
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/uploadMedia_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: Uploaded media object. A video may come back with `is_processing`
            set to `true` while its conversion runs.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Upload media (binary)
      tags:
      - Media
  /{workspaceUuid}/media/{mediaUuid}:
    get:
      description: Returns a single media asset.
      operationId: getMedia
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/mediaUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: Media asset
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get media
      tags:
      - Media
    put:
      description: |
        Update the name, alt text, or folder of a media asset. Only the keys present in the body
        are written. Sending `folder: null` moves the item to the library root; omitting `folder`
        leaves it where it is.
      operationId: updateMedia
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/mediaUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateMedia_request'
        required: true
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Update media
      tags:
      - Media
  /{workspaceUuid}/media/chunked/initiate:
    post:
      description: |
        Start a chunked upload session for large files. Returns an `upload_uuid`,
        `chunk_size`, and `total_chunks` to use for subsequent chunk requests.
      operationId: initiateChunkedUpload
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/initiateChunkedUpload_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/initiateChunkedUpload_201_response'
          description: Chunked upload session details
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Initiate chunked upload
      tags:
      - Media
  /{workspaceUuid}/media/remote/initiate:
    post:
      description: |
        Download a file from a remote URL into the media library.
        A file under 10 MB (or one whose server does not send its size) is downloaded during the request:
        the response has `status: completed` and the `media` object, or `status: failed` and an `error`.
        A larger file downloads in the background: the response has `status: pending` and a `download_id`;
        poll `getRemoteUploadStatus` with it until `status` is `completed` or `failed`.
      operationId: initiateRemoteUpload
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/initiateRemoteUpload_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/initiateRemoteUpload_200_response'
          description: "The imported media, the download failure, or a background\
            \ download to poll"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Initiate remote upload
      tags:
      - Media
  /{workspaceUuid}/media/chunked/{uploadUuid}/upload:
    post:
      description: Upload a single chunk of a chunked upload session.
      operationId: uploadChunk
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: uploadUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/uploadChunk_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uploadChunk_201_response'
          description: Chunk received
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Upload a chunk
      tags:
      - Media
  /{workspaceUuid}/media/chunked/{uploadUuid}/complete:
    post:
      description: Signal that all chunks have been uploaded. Returns the final media
        object. A video may come back with `is_processing` set to `true` while its
        conversion runs.
      operationId: completeChunkedUpload
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: uploadUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/completeChunkedUpload_request'
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: Completed media object
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Complete chunked upload
      tags:
      - Media
  /{workspaceUuid}/media/chunked/{uploadUuid}:
    delete:
      description: Cancel an in-progress chunked upload session and clean up uploaded
        chunks.
      operationId: abortChunkedUpload
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: uploadUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Upload aborted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Abort chunked upload
      tags:
      - Media
  /{workspaceUuid}/media/remote/{downloadId}/status:
    get:
      description: |
        Poll a background download started by `initiateRemoteUpload` until `status` is `completed` or `failed`.
        `status` moves from `pending` to `downloading` and `processing`, and ends as `completed` (with `media`)
        or `failed` (with `error`). The final result is returned once: after a `completed` or `failed` response the download id is
        forgotten and later polls return `404`, as do ids older than one hour.
      operationId: getRemoteUploadStatus
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: downloadId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getRemoteUploadStatus_200_response'
          description: Download status
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getRemoteUploadStatus_404_response'
          description: "Unknown download id, one from another workspace, one older\
            \ than an hour, or one whose final result was already returned"
      summary: Get remote upload status
      tags:
      - Media
  /{workspaceUuid}/media/folders:
    get:
      description: Returns the whole folder tree of the media library in one response
        (not paginated). Rebuild the tree from each folder's `parent`.
      operationId: listMediaFolders
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listMediaFolders_200_response'
          description: All media folders
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List media folders
      tags:
      - Media
    post:
      description: Creates a folder at the top level or under `parent`. The name must
        be unique among its siblings.
      operationId: createMediaFolder
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createMediaFolder_request'
        required: true
      responses:
        "201":
          content:
