    PostOptionsTikTok:
      description: |
        TikTok options. Every field is a map of `account-<account id>` to a value, so one post can carry
        different settings for several TikTok accounts.
      example:
        brand_content_toggle:
          key: true
        privacy_level:
          account-12: PUBLIC_TO_EVERYONE
        allow_comments:
          key: true
        content_disclosure:
          key: true
        brand_organic_toggle:
          key: true
        allow_stitch:
          key: true
        allow_duet:
          key: true
        is_aigc:
          account-12: true
        auto_add_music:
          key: true
      properties:
        privacy_level:
          additionalProperties:
            enum:
            - PUBLIC_TO_EVERYONE
            - MUTUAL_FOLLOW_FRIENDS
            - SELF_ONLY
            - FOLLOWER_OF_CREATOR
            - ""
            - null
            nullable: true
            type: string
          example:
            account-12: PUBLIC_TO_EVERYONE
        is_aigc:
          additionalProperties:
            type: boolean
          description: TikTok's "AI-generated content" label.
          example:
            account-12: true
        allow_comments:
          additionalProperties:
            type: boolean
        allow_duet:
          additionalProperties:
            type: boolean
        allow_stitch:
          additionalProperties:
            type: boolean
        auto_add_music:
          additionalProperties:
            type: boolean
        content_disclosure:
          additionalProperties:
            type: boolean
          description: Discloses branded or promotional content; then set `brand_organic_toggle`
            and/or `brand_content_toggle`.
        brand_organic_toggle:
