          type: integer
        user_id:
          nullable: true
          type: integer
        token_ref:
          description: "First 12 hex characters of the SHA-256 of the API token used,\
            \ to tell tokens apart."
          nullable: true
          type: string
        client:
          description: "`X-PostBoost-Client` header, else the `User-Agent`."
          nullable: true
          type: string
        route_name:
          nullable: true
          type: string
        method:
          type: string
        post_uuid:
          nullable: true
          type: string
        outcome:
          $ref: '#/components/schemas/ApiActivityOutcome'
        http_status:
          type: integer
        created_at:
          format: date-time
          type: string
      required:
      - created_at
      - http_status
      - id
      - method
      - outcome
    BlogToSocialInput:
      description: |
        At least one of `url` or (`title` + `excerpt`) must be provided.
        If both are given, direct values take priority over the scraped URL content.
      example:
        account_ids:
        - 5
        - 12
        tone: professional
        hashtags: few
        image_url: https://example.com/images/post-cover.jpg
        language: auto
        title: 10 Tips for Better Social Media
        url: https://example.com/blog/my-post
        platforms:
        - twitter
        - linkedin
        cta: link
        create_post: false
        use_brand_voice: true
        excerpt: Social media success starts with consistency and knowing your audience...
        content_length: medium
        custom_instructions: Always mention that PostBoost has a free plan.
      properties:
        url:
          description: Blog post URL to scrape. Required if `title` and `excerpt`
            are not provided.
          example: https://example.com/blog/my-post
          format: uri
          maxLength: 2000
          type: string
        title:
          description: Blog post title. Required if `url` is not provided.
          example: 10 Tips for Better Social Media
          maxLength: 500
          type: string
        excerpt:
          description: Blog post summary or excerpt. Required if `url` is not provided.
          example: Social media success starts with consistency and knowing your audience...
          maxLength: 5000
          type: string
        image_url:
          description: |
            Featured image URL for the blog post. When `create_post` is `true`, the image is imported into the workspace media library and attached to the draft post. If omitted in URL mode, the scraper attempts to extract the `og:image` meta tag.
          example: https://example.com/images/post-cover.jpg
          format: uri
          maxLength: 2000
          nullable: true
          type: string
        platforms:
          description: |
            Target social media platforms. Only connected accounts matching these platforms are used. If omitted, all connected accounts in the workspace are targeted.
          example:
          - twitter
          - linkedin
          items:
            enum:
            - twitter
            - facebook_page
            - instagram
            - threads
            - mastodon
            - youtube
            - gbp
            - pinterest
            - linkedin
            - linkedin_page
            - tiktok
            - bluesky
            type: string
          nullable: true
          type: array
        account_ids:
          description: |
            Specific account IDs to generate captions for. Takes precedence over `platforms` when both are provided.
          example:
          - 5
          - 12
          items:
            type: integer
          nullable: true
          type: array
        tone:
          default: engaging
          description: Writing tone for all generated captions.
          enum:
          - neutral
          - friendly
          - formal
          - edgy
          - engaging
          - casual
          - professional
          - humorous
          - inspirational
          - conversational
          - null
          example: professional
          nullable: true
          type: string
        content_length:
          default: medium
          description: Desired length of the generated captions.
          enum:
          - short
          - medium
          - long
          - null
          example: medium
          nullable: true
          type: string
        hashtags:
          default: few
          description: "Hashtag quantity: none (0), few (1-3), some (3-5), many (5+)."
          enum:
          - none
          - few
          - some
          - many
          - null
          example: few
          nullable: true
          type: string
        cta:
          default: none
          description: Call-to-action type appended to each caption.
          enum:
          - none
          - question
          - link
          - subscribe
          - follow
          - share
          - learn_more
          - signup
          - buy
          - download
          - null
          example: link
          nullable: true
          type: string
        language:
          default: auto
          description: |
            Output language as an ISO 639-1 code (e.g. `en`, `de`, `fr`). Use `auto` to match the blog post's language automatically.
          example: auto
          maxLength: 10
          nullable: true
          type: string
        custom_instructions:
          description: Additional instructions appended to the AI prompt (e.g. "always
            mention our free tier").
          example: Always mention that PostBoost has a free plan.
          maxLength: 500
          nullable: true
          type: string
        create_post:
          default: false
          description: |
            When `true`, creates a draft post in the workspace with per-account caption versions. If an image is available, it is imported and attached to the post.
          nullable: true
          type: boolean
        use_brand_voice:
          default: true
          description: |
            Apply the workspace brand voice (see `GET brand-voice`) to the captions. An explicit `tone` is kept, but the brand voice wins on vocabulary, words to avoid and calls to action.
          nullable: true
          type: boolean
    BlogToSocialResponse:
      example:
        post_uuid: 01942c3d-1234-7abc-8ef0-1234567890ab
        credits_remaining: 37
        blog_title: 10 Tips for Better Social Media
        media:
          id: 42
          url: https://postboost.co/storage/workspaces/1/blog-images/2026/04/cover.jpg
        blog_excerpt: Social media success starts with consistency...
        captions:
        - account_id: 5
          provider: x
          character_limit: 280
          error: error
          content: "Unlock better social media results with these 10 proven tips.\
            \ #SocialMedia #Marketing"
          character_count: 87
        - account_id: 5
          provider: x
          character_limit: 280
          error: error
          content: "Unlock better social media results with these 10 proven tips.\
            \ #SocialMedia #Marketing"
          character_count: 87
        credits_used: 3
      properties:
        blog_title:
          description: The blog post title (scraped or provided directly).
          example: 10 Tips for Better Social Media
          type: string
        blog_excerpt:
          description: A short excerpt from the blog post content.
          example: Social media success starts with consistency...
          type: string
        captions:
          description: "Generated captions, one per target account."
          items:
            $ref: '#/components/schemas/BlogToSocialCaption'
          type: array
        post_uuid:
          description: UUID of the created draft post. Only present when `create_post`
            was `true`.
          example: 01942c3d-1234-7abc-8ef0-1234567890ab
          format: uuid
          nullable: true
          type: string
        media:
          $ref: '#/components/schemas/BlogToSocialMedia'
        credits_used:
          description: Number of AI credits consumed by this request (one per successful
            caption).
          example: 3
          type: integer
        credits_remaining:
          description: Remaining AI credits for the current billing period. `null`
            for unlimited plans.
          example: 37
          nullable: true
          type: integer
    BlogToSocialCaption:
      example:
        account_id: 5
        provider: x
        character_limit: 280
        error: error
        content: "Unlock better social media results with these 10 proven tips. #SocialMedia\
          \ #Marketing"
        character_count: 87
      properties:
        account_id:
          description: ID of the social account this caption was generated for.
          example: 5
          type: integer
        provider:
          description: Social media platform identifier.
          example: x
          type: string
        content:
          description: The generated caption text. `null` if generation failed for
            this account.
          example: "Unlock better social media results with these 10 proven tips.\
            \ #SocialMedia #Marketing"
          nullable: true
          type: string
        character_count:
          description: Character count of the generated content. `null` if generation
            failed.
          example: 87
          nullable: true
          type: integer
        character_limit:
          description: Maximum allowed character count for this platform.
          example: 280
          type: integer
        error:
          description: Error message if caption generation failed for this account.
            `null` on success.
          nullable: true
          type: string
    BlogToSocialMedia:
      description: The imported featured image. Only present when `create_post` was
        `true` and an image was available.
      example:
        id: 42
        url: https://postboost.co/storage/workspaces/1/blog-images/2026/04/cover.jpg
      properties:
        id:
          description: Media library ID of the imported image.
          example: 42
          type: integer
        url:
          description: Public URL of the imported image in the workspace media library.
          example: https://postboost.co/storage/workspaces/1/blog-images/2026/04/cover.jpg
          format: uri
          type: string
    PaginationMeta:
      properties:
