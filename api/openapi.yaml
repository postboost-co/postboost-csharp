        are given.
      explode: true
      in: query
      name: period
      required: false
      schema:
        default: this_month
        enum:
        - this_week
        - last_week
        - this_month
        - last_month
        - last_3_months
        - this_year
        type: string
      style: form
    analyticsDateFrom:
      description: Start of a custom range (Y-m-d). Required with `date_to`; the range
        may span at most 366 days.
      explode: true
      in: query
      name: date_from
      required: false
      schema:
        format: date
        type: string
      style: form
    analyticsDateTo:
      description: End of a custom range (Y-m-d). Required with `date_from`; must
        not be before it.
      explode: true
      in: query
      name: date_to
      required: false
      schema:
        format: date
        type: string
      style: form
  responses:
    Unauthorized:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Unauthenticated.
                type: string
      description: Missing or invalid API token.
    Forbidden:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Access forbidden.
                type: string
      description: Insufficient permissions.
    WorkspaceForbidden:
      content:
        application/json:
          schema:
            properties:
              message:
                example: This action is unauthorized.
                type: string
      description: |
        Access denied. Returned when the caller is not a member of the workspace, lacks the role
        the endpoint needs, or the workspace's plan does not include API access (capability `api`).
    NotFound:
      content:
        application/json:
          schema:
            properties:
              message:
