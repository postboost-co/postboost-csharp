          description: When the account last published successfully.
          format: date-time
          nullable: true
          type: string
        last_error:
          description: "The error of the account's latest failed publish, shortened\
            \ to 300 characters."
          nullable: true
          type: string
        reconnect_url:
          description: Where a workspace member reconnects the account.
          format: uri
          type: string
