    PostContent:
      description: |
        One item of a version's `content` array. The first item is always the post itself.
        What a second item means depends on the network:

        - **Facebook Page, Instagram, LinkedIn** (profile and page): the second item's `body` is
          published as the **first comment** under the post, right after the post goes live.
          Only one comment is supported; further items are ignored. Facebook Stories take no comment.
        - **X, Threads, Bluesky, Mastodon, Pixelfed**: every additional item is published as the
          next post of a **thread**, in order.
        - **All other networks** (YouTube, TikTok, Pinterest, Google Business Profile): only the
          first item is published; additional items are ignored.
      example:
        video_thumbs:
        - "{}"
        - "{}"
        media:
        - 5
        - 5
        body: body
        url: https://openapi-generator.tech
      properties:
        body:
          description: "Post text/caption. For a second item on Facebook Page, Instagram\
            \ or LinkedIn this is the first comment."
          nullable: true
          type: string
        url:
          description: "Link shown as a preview card on LinkedIn, Bluesky and Facebook\
            \ Pages (Facebook builds the card from the page's own Open Graph tags).\
            \ If omitted and the item has no media, the first link in `body` is used."
          format: uri
          nullable: true
          type: string
        media:
          description: Array of media IDs from the media library.
          items:
            type: integer
          type: array
        video_thumbs:
          items:
            type: object
          type: array
    PostVersion:
      example:
        synced_with: 0
        account_id: 6
        is_original: true
        options:
          youtube:
            contains_synthetic_media: false
            made_for_kids: false
            title: title
            status: public
          tiktok:
            brand_content_toggle:
              key: true
            privacy_level:
              account-12: PUBLIC_TO_EVERYONE
            allow_comments:
              key: true
            content_disclosure:
              key: true
            brand_organic_toggle:
              key: true
            allow_stitch:
              key: true
            allow_duet:
              key: true
            is_aigc:
              account-12: true
            auto_add_music:
              key: true
          instagram:
            ai_generated: false
            collaborators:
            - collaborators
            - collaborators
            - collaborators
            type: post
          instagram_standalone:
            ai_generated: false
            collaborators:
            - collaborators
            - collaborators
            - collaborators
            type: post
        content:
        - video_thumbs:
          - "{}"
          - "{}"
          media:
          - 5
          - 5
          body: body
          url: https://openapi-generator.tech
        - video_thumbs:
          - "{}"
          - "{}"
          media:
          - 5
          - 5
          body: body
          url: https://openapi-generator.tech
      properties:
        account_id:
          description: Use `0` for the original/default version.
          type: integer
        is_original:
          description: Must be `true` for the first version.
          type: boolean
        synced_with:
          description: "Account ID of the version this version follows (`0` = the\
            \ original), or null when it is edited independently. Ignored on the original\
            \ version."
          minimum: 0
          nullable: true
          type: integer
        content:
          description: |
            Ordered content items. Item 0 is the post. Item 1 is the first comment on
            Facebook Page, Instagram and LinkedIn, or the next thread post on X, Threads,
            Bluesky, Mastodon and Pixelfed. See `PostContent`.
          items:
            $ref: '#/components/schemas/PostContent'
          minItems: 1
          type: array
        options:
          $ref: '#/components/schemas/PostVersion_options'
      required:
      - account_id
      - content
      - is_original
    PostOptionsYoutube:
      description: YouTube options. The video title is required.
