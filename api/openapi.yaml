        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Recycle a post on an interval
      tags:
      - Posts
  /{workspaceUuid}/rss-feeds:
    get:
      description: "RSS and Atom feeds whose new items become posts, newest first."
      operationId: listRssFeeds
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listRssFeeds_200_response'
          description: The workspace's feeds
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List RSS feeds
      tags:
      - Posts
    post:
      description: |
        Checks the feed every 30 minutes and turns each item published after the feed was added into
        a post for `account_ids`: a draft (`mode: draft`, default), a queued post (`mode: queue`), or a
        queued post awaiting approval (`mode: needs_approval`: it gets the next free queue slot and
        publishes only after someone approves it).
        The text comes from `template` with `{title}`, `{link}` and `{summary}` placeholders. Each
        item becomes at most one post, at most `max_items_per_run` per check and 20 per workspace per
        day. Posts pass the same guardrails as API-created posts. Only public http(s) URLs are
        accepted. Admins and members only.
      operationId: createRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              url: https://blog.example.com/feed
              name: Company blog
              account_ids:
              - 12
              - 14
              mode: draft
              template: "New on the blog: {title} {link}"
            schema:
              $ref: '#/components/schemas/RssFeedInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRssFeed_201_response'
          description: The feed was added
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Add an RSS feed
      tags:
      - Posts
  /{workspaceUuid}/rss-feeds/{feedUuid}:
    delete:
      description: Stops the feed. Posts it already created stay. Admins and members
        only.
      operationId: deleteRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the RSS feed.
        explode: false
        in: path
        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Delete an RSS feed
      tags:
      - Posts
    get:
      operationId: getRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the RSS feed.
        explode: false
        in: path
        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRssFeed_201_response'
          description: The feed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get an RSS feed
      tags:
      - Posts
    parameters:
    - $ref: '#/components/parameters/workspaceUuid'
    - description: UUID of the RSS feed.
      explode: false
      in: path
      name: feedUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: "Fields you leave out keep their value. Resuming (`active: true`)\
        \ clears the error backoff. Admins and members only."
      operationId: updateRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the RSS feed.
        explode: false
        in: path
        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
