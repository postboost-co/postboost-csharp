  /{workspaceUuid}/ai/repurpose:
    post:
      description: |
        Turns an article URL, a YouTube video, a PDF or pasted text into one **draft** post with a
        caption for every target account, plus a carousel of rendered slide images (hook, 1 to 6 idea
        slides, call to action; 1080×1350 PNG). Nothing is published or scheduled.

        **Sources** (`source_type`):
        - `url`: the article is fetched and its main text extracted.
        - `youtube`: title, description and chapters come from YouTube; send the transcript in
          `transcript` for better results (required when the description is short).
        - `pdf`: `pdf_url` must be a public PDF of at most 20 MB; the first 30 pages are read.
        - `text`: send `title` and `text`.

        **Carousel per network**: Instagram, Facebook, Threads up to 10 slides; LinkedIn up to 9;
        X and Bluesky up to 4; other networks get the cover slide; YouTube and TikTok get none
        (listed in `warnings`). Without a carousel, the source image (article image or video
        thumbnail) is attached when available.

        **AI credits**: one per target account plus one for the carousel outline. Slides are drawn
        without AI and cost nothing. The workspace brand voice applies unless `use_brand_voice` is
        `false`. Send an `Idempotency-Key` so a retried call does not create a second draft.
        Limited to 10 calls per minute.

        **Long runs**: the run is queued. The call waits up to 20 seconds and answers `200` with the
        result when the run finished by then. Otherwise it answers `202` with a `run_id`; poll
        `getRepurposeRun` (`status_url`) every few seconds until the status is `ok`, `partial` or
        `failed`. Send `async: true` to get the `202` right away. Validation, account and credit
        errors are answered before anything is queued.
      operationId: repurposeContent
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            examples:
              article:
                summary: Article URL to Instagram and LinkedIn
                value:
                  source_type: url
                  url: https://example.com/blog/my-post
                  platforms:
                  - instagram
                  - linkedin_page
                  slide_count: 7
              youtube:
                summary: YouTube video with transcript
                value:
                  source_type: youtube
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  transcript: Today we walk through...
                  account_ids:
                  - 12
                  - 15
            schema:
              $ref: '#/components/schemas/RepurposeInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repurposeContent_200_response'
          description: Draft post set created
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repurposeContent_202_response'
          description: The run is still going (or `async` was set); poll `status_url`.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/InsufficientCredits'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repurposeContent_500_response'
          description: The run failed while the call waited. `getRepurposeRun` shows
            the error.
      summary: Repurpose long-form content into a draft post set with a carousel
      tags:
      - AI
  /{workspaceUuid}/ai/repurpose/runs/{runId}:
    get:
      description: |
        Status of a run started by `repurposeContent`. `queued` and `running` mean it is still
        going; poll again in a few seconds. A run that has not finished after 10 minutes reports
        `failed`. `result` holds the same `data` body a `200` from `repurposeContent` returns, for
        one hour after the run ended with `ok` or `partial`; after that it is `null` (the draft post
        stays). Limited to 60 calls per minute.
      operationId: getRepurposeRun
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: The `run_id` from `repurposeContent`.
        explode: false
        in: path
        name: runId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getRepurposeRun_200_response'
          description: Run status
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get a repurpose run
      tags:
      - AI
  /{workspaceUuid}/agents:
    get:
      description: |
        Background agents switched on for the workspace. Agents run on a schedule, record every run
        and never change a post themselves: each change is a proposal that a workspace admin or
        member approves. Available types: `pre_publish_checker`, `failed_post_fixer`.
      operationId: listAgents
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listAgents_200_response'
          description: Agents
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List background agents
      tags:
      - Agents
    post:
      description: |
        Creates an agent (one per type per workspace). It first runs within five minutes, then on its
        `schedule`. **Pre-publish checker** looks at posts scheduled in the next `horizon_hours` and
        proposes holding (back to draft) posts that would fail: disconnected accounts, network
        requirements, daily caps, the X allowance and links that answer an error. It proposes caption
        edits that drop `banned_phrases`. With `ai_review: true` it also asks AI to review up to
        `max_ai_reviews_per_run` posts per run (one AI credit each). **Failed-post fixer** looks at
        posts that failed on an account in the last `lookback_hours` and proposes, per post and
        account, `reconnect_account` (the account's token expired), or `retry_account`, with a
        caption trimmed to the network limit when the text is over it. One open proposal per post
        and account. It uses no AI. Admins and members only.
      operationId: createAgent
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              type: pre_publish_checker
              schedule: hourly
              settings:
                horizon_hours: 24
                banned_phrases:
                - guaranteed
            schema:
              $ref: '#/components/schemas/WorkspaceAgentInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createAgent_201_response'
          description: Agent created
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Switch on a background agent
      tags:
      - Agents
  /{workspaceUuid}/agents/{agentUuid}:
    delete:
      description: Removes the agent. Its run history and proposals stay. Admins and
        members only.
      operationId: deleteAgent
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: agentUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteAgent_200_response'
          description: Agent deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Delete a background agent
      tags:
      - Agents
    put:
      description: "Changes the name, schedule, settings or `enabled`. Settings you\
        \ leave out keep their value. Admins and members only."
      operationId: updateAgent
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: agentUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceAgentUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createAgent_201_response'
          description: Agent updated
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Update a background agent
      tags:
      - Agents
  /{workspaceUuid}/agents/{agentUuid}/run:
    post:
      description: "Queues a run outside the schedule (`trigger: manual`). Six per\
