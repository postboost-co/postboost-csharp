          description: Only terms whose name or definition contains this text (case-insensitive).
            Omit it for every term.
          maxLength: 100
          type: string
        style: form
      - explode: true
        in: query
        name: category
        required: false
        schema:
          description: Only terms of this category. Omit it for every category.
