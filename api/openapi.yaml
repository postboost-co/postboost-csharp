        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listAgentProposals_200_response'
          description: Proposals
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: List agent proposals (approval queue)
      tags:
      - Agents
  /{workspaceUuid}/agent-proposals/{proposalUuid}/approve:
    post:
      description: |
        Applies the proposal at once: `hold_post` moves the post back to draft, `edit_caption`
        replaces the caption, `retry_account` saves the shortened caption (if any) on that account's
        version and publishes that account again, `reconnect_account` only records the decision.
        When the post was edited, deleted or left the schedule since the proposal was made (for
        `retry_account`: the account is no longer failed, the post is publishing, or the plan does
        not allow scheduling), nothing changes and the proposal becomes `stale`. Admins and members
        only.
      operationId: approveAgentProposal
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: proposalUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProposalDecision'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/approveAgentProposal_200_response'
          description: "Decision recorded; read `data.status` (`applied`, `stale`\
            \ or `failed`)"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/approveAgentProposal_409_response'
          description: "The proposal was already decided, expired or went stale; `data`\
            \ is its current state."
      summary: Approve and apply an agent proposal
      tags:
      - Agents
  /{workspaceUuid}/agent-proposals/{proposalUuid}/reject:
    post:
      description: Records the rejection (and optional note); nothing changes on the
        post. Admins and members only.
      operationId: rejectAgentProposal
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: proposalUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProposalDecision'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/approveAgentProposal_200_response'
          description: Proposal rejected
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/approveAgentProposal_409_response'
          description: "The proposal was already decided, expired or went stale; `data`\
            \ is its current state."
      summary: Reject an agent proposal
      tags:
      - Agents
  /{workspaceUuid}/webhooks/subscriptions:
    get:
      description: |
        The workspace's webhooks, newest first: subscriptions created through this API and the ones
        added in **Settings → Webhooks**. Secrets are never returned here. Workspace admins only;
        needs the `webhooks` plan capability and, for scoped keys, the `webhooks` ability.
      operationId: listWebhookSubscriptions
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listWebhookSubscriptions_200_response'
          description: The workspace's webhooks
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List webhook subscriptions
      tags:
      - Webhooks
      x-mcp-exclude: true
    post:
      description: |
        Registers a callback URL for the given events, the way n8n, Zapier and Make instant triggers
        do. Deliveries are `POST` requests with a JSON body (see [Webhooks](/webhooks) for the
        payload), signed with the returned `secret` in `X-Signature` (HMAC-SHA256 of the raw body,
        hex encoded) and attempted up to 3 times. Only public `https://` URLs are accepted. The
        `secret` is in this response only. Workspace admins only.
      operationId: createWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              callback_url: https://n8n.example.com/webhook/7d1c0c2e/postboost
              events:
              - post.published
              - post.publishing_failed
              source: n8n
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createWebhookSubscription_201_response'
          description: The subscription was created
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Subscribe a webhook
      tags:
      - Webhooks
      x-mcp-exclude: true
  /{workspaceUuid}/webhooks/subscriptions/{subscriptionUuid}:
    delete:
      description: Deletes the webhook and stops its deliveries. Workspace admins
        only.
      operationId: deleteWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the webhook subscription.
        explode: false
        in: path
        name: subscriptionUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Unsubscribe a webhook
      tags:
      - Webhooks
      x-mcp-exclude: true
  /{workspaceUuid}/usage/ai:
    get:
      description: |
        The workspace's AI credits: text credits (captions, rewrites, outlines, alt text; counted per
        billing cycle) and image credits (one per generated, edited or varied image, and one per
        repurpose carousel; counted per calendar month, UTC). `limit` and `remaining` are `null` when
        the workspace has no limit. Readable when credits are used up; costs nothing.

        When image credits run out, the image endpoints and carousels answer `429` with
        `code: image_credits_exhausted`; when text credits run out, the AI endpoints answer `429` with
        `code: ai_credits_exhausted`. Image endpoint responses also carry `image_credits_used` and
        `image_credits_remaining`; their `credits_used` counts text credits only. If the image pool is
        switched off (`image.enabled: false`), images cost text credits as before.
      operationId: getAIUsage
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsage'
          description: Credit usage
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: AI credit usage
      tags:
      - AI
  /{workspaceUuid}/brand-voice/learn:
    post:
      description: |
        Reads the workspace's latest published posts (original text) and proposes a brand voice in the
        same shape as `GET /brand-voice`. Returns a draft and saves nothing unless `apply: true`.

        Without `overwrite`, learned values only fill fields that are empty (tone sliders and styles
        still at their defaults count as empty); with `overwrite: true` they replace them. The first
        five sampled posts become `example_posts`. Needs at least 3 published posts (`422`,
        `code: not_enough_posts`). Costs one AI text credit per AI call (one retry when the reply is
        not usable). Admins and members only. A key limited to some accounts must send `account_ids`;
        only posts whose accounts are all among them are read. `apply` also needs the `write` ability.
      operationId: learnBrandVoice
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnBrandVoiceInput'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnBrandVoiceResponse'
          description: Proposed (or saved) brand voice
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/InsufficientScope'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
          description: "Validation error, AI disabled, or fewer than 3 published posts\
            \ (`code: not_enough_posts`)"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
          description: "AI text credits used up (`code: ai_credits_exhausted`)"
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
          description: "The AI reply was not a usable profile (`code: ai_unusable_response`)"
      summary: Learn a brand voice from past posts
      tags:
      - AI
  /{workspaceUuid}/clients:
    get:
      description: |
        Client workspaces this workspace created on the Reseller plan, active first, then archived.
        `accounts_needing_reconnect` counts accounts whose connection must be renewed. `meta` gives
        the active clients and the plan's client limit. Workspace admins with an unscoped key only;
        other workspaces get `403` with `code: not_a_reseller`.
      operationId: listResellerClients
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listResellerClients_200_response'
          description: The reseller's client workspaces
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
          description: "Not a workspace admin, a scoped key, or the workspace is not\
            \ on the Reseller plan (`code: not_a_reseller`)"
      summary: List client workspaces
      tags:
      - Workspaces
      x-mcp-exclude: true
    post:
      description: |
        Creates a client workspace on the Reseller client plan, with the caller as its owner and
        admin, and links it to this workspace. Fails with `422` and `code: client_limit_reached` once
        the plan's client limit is used (archived clients do not count). Archive clients on the
        Client workspaces page. Workspace admins with an unscoped key only.
      operationId: createResellerClient
