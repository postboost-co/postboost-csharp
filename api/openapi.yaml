            `before`, `after`. `retry_account`: `error` (up to 300 characters) and, for a shortened
            caption, `source_account_id` (the version it was taken from, 0 = original), `item_index`,
            `before`, `after`. `reconnect_account`: `error`, `reconnect_url`. All carry
            `post_updated_at`.
