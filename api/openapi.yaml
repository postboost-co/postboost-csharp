        id: 0
        publish_status: pending
        errors:
        - Account_errors_inner
        - Account_errors_inner
        username: myhandle
      properties:
        id:
          type: integer
        uuid:
          format: uuid
          type: string
        name:
          example: My Instagram
          type: string
        username:
          example: myhandle
          type: string
        image:
          format: uri
          type: string
          nullable: true
        provider:
          enum:
          - instagram
          - tiktok
          - pinterest
          - twitter
          - linkedin
          - facebook_page
          - youtube
          - mastodon
          type: string
        data:
          description: Provider-specific metadata.
          type: object
        authorized:
          type: boolean
        profile_url:
          description: "Public URL of the account's profile on the network, when known."
          format: uri
          type: string
          nullable: true
        publish_status:
          description: Only present when the account is embedded in a post. Publishing
            state of this account for the post.
          enum:
          - pending
          - publishing
          - published
          - failed
          type: string
        published_parts:
          description: Only present when the account is embedded in a post. How many
            parts (for example thread items or a first comment) are live on the network.
          minimum: 0
          type: integer
        external_url:
          description: "Only present when the account is embedded in a post. URL of\
            \ the published post on the network, null until it is live."
          nullable: true
          type: string
        provider_post_id:
          description: "Only present when the account is embedded in a post. The network's\
            \ own ID of the published post (for example a LinkedIn share URN or a\
            \ tweet ID), null until it is live."
          nullable: true
          type: string
        errors:
          description: |
            Only present when the account is embedded in a post. Why publishing to this account failed.
            A raw network error is stored as two entries: a readable line
            (`"<Network>: <message> (code <code>)"`) and an object `{platform, code, message, raw}` with the
            network's original response in `raw`. Other failures are a single readable string.
          items:
            $ref: '#/components/schemas/Account_errors_inner'
          type: array
        created_at:
          description: "UTC, formatted `Y-m-d H:i:s`."
          example: 2026-10-11 09:30:00
          type: string
