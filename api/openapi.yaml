    Account:
      example:
        image: https://openapi-generator.tech
        data: "{}"
        profile_url: https://openapi-generator.tech
        published_parts: 0
        created_at: 2026-10-11 09:30:00
        uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
