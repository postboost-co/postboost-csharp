components:
  headers:
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier
        request with the same `Idempotency-Key`.
      explode: false
      schema:
        enum:
        - "true"
      style: simple
  parameters:
    IdempotencyKey:
      description: |
        Unique key (for example a UUID) that makes the request safe to retry. A repeat with the same key and
        body within 24 hours returns the stored response with `Idempotent-Replayed: true` and has no further
        effect. Keys are scoped to your user, the workspace, the method and the path.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 255
        minLength: 1
        type: string
      style: simple
    workspaceUuid:
      description: UUID of the workspace.
      explode: false
      in: path
      name: workspaceUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    accountUuid:
      description: UUID of the social media account.
      explode: false
      in: path
      name: accountUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    mediaUuid:
      description: UUID of the media asset.
      explode: false
      in: path
      name: mediaUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    tagUuid:
      description: UUID of the tag.
      explode: false
      in: path
      name: tagUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    postUuid:
      description: UUID of the post.
      explode: false
      in: path
      name: postUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    userId:
      description: ID of the user.
      explode: false
      in: path
      name: userId
      required: true
      schema:
        type: integer
      style: simple
    receiptUuid:
      description: UUID of the receipt.
      explode: false
      in: path
      name: receiptUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    folderUuid:
      description: UUID of the media folder.
      explode: false
      in: path
      name: folderUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    mentionId:
      description: The mention's `id` (a UUID).
      explode: false
      in: path
      name: mentionId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    analyticsPeriod:
      description: Preset reporting period. Ignored when `date_from` and `date_to`
        are given.
      explode: true
      in: query
      name: period
      required: false
      schema:
        default: this_month
        enum:
        - this_week
        - last_week
        - this_month
        - last_month
        - last_3_months
        - this_year
        type: string
      style: form
    analyticsDateFrom:
      description: Start of a custom range (Y-m-d). Required with `date_to`; the range
        may span at most 366 days.
      explode: true
      in: query
      name: date_from
      required: false
      schema:
        format: date
        type: string
      style: form
    analyticsDateTo:
      description: End of a custom range (Y-m-d). Required with `date_from`; must
        not be before it.
      explode: true
      in: query
      name: date_to
      required: false
      schema:
        format: date
        type: string
      style: form
  responses:
    Unauthorized:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Unauthenticated.
                type: string
      description: Missing or invalid API token.
    Forbidden:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Access forbidden.
                type: string
      description: Insufficient permissions.
    WorkspaceForbidden:
      content:
        application/json:
          schema:
            properties:
              message:
                example: This action is unauthorized.
                type: string
      description: |
        Access denied. Returned when the caller is not a member of the workspace, lacks the role
        the endpoint needs, or the workspace's plan does not include API access (capability `api`).
    NotFound:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Not found.
                type: string
      description: Resource not found.
    ValidationError:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Validation errors.
                type: string
              errors:
                additionalProperties:
                  items:
                    type: string
      description: Validation failed.
    InsufficientCredits:
      content:
        application/json:
          schema:
            properties:
              message:
                example: Insufficient AI credits. You need 5 credits but only have
                  2 remaining this month.
                type: string
      description: AI credits exhausted for this billing period.
    InvalidIdempotencyKey:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageOnly'
      description: The `Idempotency-Key` header is not 1 to 255 printable ASCII characters.
    PostConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuardrailError'
      description: |
        Either the content duplicates a post created for the same account within the duplicate window
        (`code: duplicate_post`, `existing_post_uuid` names it; resend with `allow_duplicate: true` to post anyway),
        or a request with the same `Idempotency-Key` is still in progress (no `code`, `Retry-After: 1`).
    PostUnprocessable:
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
              errors:
                additionalProperties:
                  items:
                    type: string
              code:
                enum:
                - account_unauthorized
                - account_token_missing
                type: string
              account_id:
                type: integer
            required:
            - message
      description: |
        Validation failed (`errors` lists the fields), the `Idempotency-Key` was already used with a different
        body, or the post is scheduled to an account that cannot publish (`code: account_unauthorized` or
        `account_token_missing`, reconnect the account).
    DailyCapReached:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuardrailError'
      description: "Scheduling would exceed an account's daily post cap for that UTC\
        \ day (`code: account_daily_cap_reached`), or the workspace's monthly X allowance\
        \ (`code: x_monthly_cap_reached`)."
    InsufficientScope:
      content:
        application/json:
          schema:
            properties:
              message:
                example: This API key lacks the `write` ability.
                type: string
              code:
                enum:
                - insufficient_scope
                type: string
            required:
            - message
      description: |
        Not allowed. Either the caller is not a workspace admin (or not a member), or a scoped API key
        lacks the ability or workspace for this call (`code: insufficient_scope`).
    SuccessResponse:
      content:
        application/json:
          schema:
            properties:
              success:
                example: true
                type: boolean
      description: Operation succeeded.
  schemas:
    MessageOnly:
      example:
        message: message
      properties:
        message:
          type: string
      required:
      - message
    PostWarning:
      description: |
        A non-blocking warning on a successful create or update: the post was saved, but
        something will not behave as you may expect. Log the `code`.
        - `ai_media_without_disclosure`: the post uses media from the AI image endpoints but
          `ai_generated` is `false`, so no network AI label is applied.
        - `meta_first_comment_unavailable`: a Facebook Page or Instagram first comment cannot
          be published yet (Meta is reviewing our access); the post itself publishes.
        - `youtube_description_too_long`: the YouTube description is over 5,000 bytes (UTF-8;
          emoji and non-Latin letters take 2 to 4 bytes each), so YouTube will reject the upload.
        - `youtube_forbidden_characters`: the YouTube title or description contains `<` or `>`,
          which YouTube does not allow, so the upload will fail.
        - `threads_too_long`: a Threads post is over 500 characters as Threads counts them
          (each emoji counts as its UTF-8 bytes, most as 4), so Threads will reject it.
      example:
        code: ai_media_without_disclosure
        account_id: 6
        message: message
      properties:
        code:
          enum:
          - ai_media_without_disclosure
          - meta_first_comment_unavailable
          - youtube_description_too_long
          - youtube_forbidden_characters
          - threads_too_long
          type: string
        account_id:
          description: The account the warning is about; null when it is about the
            whole post.
          nullable: true
          type: integer
        message:
          type: string
      required:
      - account_id
      - code
      - message
    PostWarnings:
