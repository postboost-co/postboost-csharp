        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Delete an RSS feed
      tags:
      - Posts
    get:
      operationId: getRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the RSS feed.
        explode: false
        in: path
        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRssFeed_201_response'
          description: The feed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get an RSS feed
      tags:
      - Posts
    parameters:
    - $ref: '#/components/parameters/workspaceUuid'
    - description: UUID of the RSS feed.
      explode: false
      in: path
      name: feedUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: "Fields you leave out keep their value. Resuming (`active: true`)\
        \ clears the error backoff. Admins and members only."
      operationId: updateRssFeed
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the RSS feed.
        explode: false
        in: path
        name: feedUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
