        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: "Update, pause or resume an RSS feed"
      tags:
      - Posts
  /{workspaceUuid}/rss-feeds/{feedUuid}/poll:
    post:
      description: Reads the feed immediately instead of waiting for the next check.
        Limited to 6 calls per minute. Admins and members only.
