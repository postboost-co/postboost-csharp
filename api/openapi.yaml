  /{workspaceUuid}/ai/blog-to-social:
    post:
      description: |
        Generates platform-specific social media captions from a blog post URL or
        directly provided title and excerpt. Each platform generates one caption,
        which consumes one AI credit from the workspace's monthly allowance.

        **Input modes** (at least one required):
        - **URL mode**: provide `url` and the API scrapes the blog content automatically, including detecting the featured image via `og:image`.
        - **Direct mode**: provide `title` and `excerpt` directly (no scraping).

        If both are provided, direct values take priority.

        When `create_post` is `true`, a draft post is created in the workspace with
        per-account caption versions. If an image is available (from `image_url` or
        the scraped `og:image`), it is imported into the workspace media library and
        attached to the draft post.
      operationId: blogToSocial
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            examples:
              url_mode:
                summary: URL mode
                value:
                  url: https://example.com/blog/my-post
                  platforms:
                  - twitter
                  - linkedin
                  tone: professional
                  hashtags: few
                  create_post: false
              direct_mode:
                summary: Direct mode
                value:
                  title: 10 Tips for Better Social Media
                  excerpt: Social media success starts with consistency...
                  image_url: https://example.com/images/post-cover.jpg
                  platforms:
                  - instagram
                  - linkedin
                  tone: friendly
                  cta: link
                  create_post: true
            schema:
              $ref: '#/components/schemas/BlogToSocialInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blogToSocial_200_response'
          description: Captions generated successfully
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blogToSocial_429_response'
          description: AI credits exhausted for this billing period
      summary: Generate social media captions from a blog post
      tags:
      - AI
  /{workspaceUuid}/ai/image-prompt:
    post:
      description: |
        Builds a professional image generation prompt from a caption and platform.
        No image is generated. Use this to preview the prompt before calling
        `image-generate`. Costs 1 AI credit per call.

        When `image-generate` builds the prompt internally (standard mode),
        no credit is charged for the prompt step.
      operationId: imagePrompt
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePromptInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imagePrompt_200_response'
          description: Prompt built successfully
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imagePrompt_429_response'
          description: AI credits exhausted for this billing period
      summary: Build an optimized image prompt from a social media caption
      tags:
      - AI
  /{workspaceUuid}/ai/image-generate:
    post:
      description: |
        Generates one or more images and saves them immediately to the workspace
        media library.

        **Standard mode** (recommended): provide `caption` + `platform`. PostBoost
        builds a professional image prompt internally using platform-specific
        templates. No prompt engineering required.

        **Developer mode**: provide `prompt` directly to bypass prompt building.
        If both `caption` and `prompt` are sent, standard mode runs.

        Credits: 1 image credit per image (`429 image_credits_exhausted` when the monthly pool is empty).
        If the image pool is switched off, `count × credit_weight` text credits instead.
      operationId: imageGenerate
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            examples:
              standard_mode:
                summary: Standard mode (social media manager)
                value:
                  caption: "Our summer sale starts today, 30% off everything!"
                  platform: instagram
                  template: product_highlight
                  aspect_ratio: 1:1
                  count: 2
              developer_mode:
                summary: Developer mode (explicit prompt)
                value:
                  prompt: "A vibrant summer beach scene with colorful umbrellas, high\
                    \ contrast, Instagram-optimized."
                  aspect_ratio: 1:1
            schema:
              $ref: '#/components/schemas/ImageGenerateInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageGenerate_200_response'
          description: Images generated and saved to media library
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageGenerate_429_response'
          description: AI credits exhausted for this billing period
      summary: Generate social media images from a caption
      tags:
      - AI
  /{workspaceUuid}/ai/image-edit:
    post:
      description: |
        Edits an existing workspace media item using the source image and a text
        prompt. Optionally accepts a mask (transparent areas are replaced).
        Saves results to the media library.
        Credits: 1 image credit per image (`429 image_credits_exhausted` when the monthly pool is empty).
        If the image pool is switched off, `count × credit_weight` text credits instead.
      operationId: imageEdit
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageEditInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageGenerate_200_response'
          description: Images edited and saved to media library
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/InsufficientCredits'
      summary: Edit an existing media image using AI
      tags:
      - AI
  /{workspaceUuid}/ai/image-variations:
    post:
      description: |
        Creates one or more variations of an existing workspace media item.
        Saves results to the media library.
        Credits: 1 image credit per image (`429 image_credits_exhausted` when the monthly pool is empty).
        If the image pool is switched off, `count × credit_weight` text credits instead.
      operationId: imageVariations
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageVariationsInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageVariations_200_response'
          description: Variations generated and saved to media library
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/InsufficientCredits'
      summary: Generate variations of an existing media image
      tags:
      - AI
  /{workspaceUuid}/ai/image-alt-text:
    post:
      description: |
        Analyzes an existing workspace media item and generates accessible alt text.
        The alt text is saved back to the media record.
        Costs 1 AI credit per call.
      operationId: imageAltText
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAltTextInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageAltText_200_response'
          description: Alt text generated and saved to media record
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/InsufficientCredits'
      summary: Generate alt text for a media image using AI
      tags:
      - AI
  /{workspaceUuid}/posts/validate:
    post:
      description: |
        Runs everything create-post checks without creating anything: request validation,
        network requirements (text length, media count and type, links) for every given account,
        whether or not the post is scheduled, and the guardrails (duplicate content, daily caps,
        account health). Always answers `200`; read `valid`. Any workspace member, including
        viewers, may call it. Recommended agent loop: account health, validate, then create.
      operationId: validatePost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResult'
          description: Validation result
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Validate post (dry run)
      tags:
      - Posts
  /{workspaceUuid}/account-health:
    get:
      description: |
        Pre-flight health of every account in the workspace: whether it is authorized and holds an
        access token, how much of its daily post cap (per UTC day, scheduled, awaiting approval
        and published posts) is used today, and its connection health: predicted token expiry,
        latest publish outcome and where to reconnect it. The `account.token_expiring` and
        `account.disconnected` webhooks report changes as they happen.
      operationId: getAccountHealth
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAccountHealth_200_response'
          description: Health per account
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Account health
      tags:
      - Accounts
  /{workspaceUuid}/activity:
    get:
      description: |
        Every write request (`POST`, `PUT`, `DELETE`) made through the API in this workspace, newest
        first, with the client that made it and its outcome. Kept for 90 days. Send an
        `X-PostBoost-Client` header (for example `my-agent/1.2`) to label your requests; otherwise
        the `User-Agent` is recorded.
      operationId: listApiActivity
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: true
        in: query
        name: outcome
        required: false
        schema:
          $ref: '#/components/schemas/ApiActivityOutcome'
        style: form
      - description: "Client label prefix, for example `mcp`."
        explode: true
        in: query
        name: client
        required: false
        schema:
          type: string
        style: form
      - description: Only entries at or after this time (UTC).
        explode: true
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listApiActivity_200_response'
          description: Paginated activity entries (50 per page)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: List API activity
      tags:
      - Activity
  /{workspaceUuid}/brand-voice:
    delete:
      description: Removes the workspace's brand voice. AI endpoints then run without
        one. Admins and members only.
      operationId: deleteBrandVoice
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Delete the brand voice
      tags:
      - AI
    get:
      description: |
        The workspace's brand voice: identity, audience, tone sliders, style rules and example posts.
        It is the same profile as the Brand Voice page in the app (one per workspace). `data` is
        `null` when no voice is set. Any workspace member may read it; reading costs no AI credits.

        The AI endpoints apply it automatically: `blog-to-social` adds it to the caption instructions,
        `image-prompt` and `image-generate` turn it into a short visual tone line, and `image-edit`
        applies it when you send `use_brand_voice: true`. `image-variations` and `image-alt-text`
        never use it (alt text must describe the image literally). Send `use_brand_voice: false`
        to skip it on a call; responses report `meta.brand_voice_applied`.
      operationId: getBrandVoice
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getBrandVoice_200_response'
          description: "The brand voice, or `null` when none is set"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Get the brand voice
      tags:
      - AI
    put:
      description: |
        Creates the workspace's brand voice or updates it. Fields you leave out keep their current
        value. Admins and members only (not viewers); the workspace must have AI enabled.
      operationId: updateBrandVoice
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              business_name: Northwind Coffee
              industry: Specialty coffee roasting
              personality: Warm and curious about every bean. Never pushy.
              audience:
              - home baristas
              - cafe owners
              tone_formal: 2
              tone_playful: 4
              tone_technical: 3
              emoji_style: rare
              hashtag_strategy: branded
              avoid_words:
              - cheap
              - best ever
            schema:
              $ref: '#/components/schemas/BrandVoiceInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getBrandVoice_200_response'
          description: The saved brand voice
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Create or update the brand voice
      tags:
      - AI
  /{workspaceUuid}/api-keys:
    get:
      description: |
        Scoped API keys bound to this workspace, newest first. The secret is never shown again
        after creation. Workspace admins only, called with an unscoped key (a scoped key gets
        `403` with `code: insufficient_scope`).
      operationId: listApiKeys
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listApiKeys_200_response'
          description: Scoped keys of this workspace
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/InsufficientScope'
      summary: List scoped API keys
      tags:
      - Workspaces
    post:
      description: |
        Creates a least-privilege API key for the calling user, bound to this workspace. Pick the
        abilities it gets and, optionally, the accounts it may act on. The plain key is in
        `data.token` of this response only; store it safely.

        | Ability | Allows |
        |---|---|
        | `read` | Every `GET`, plus the `posts/validate` dry run |
        | `write` | Creating and changing drafts, media, tags, mentions, the brand voice |
        | `publish` | Scheduling, queueing, publishing now, approving and retrying posts, and editing a post that is already scheduled |
        | `ai` | The `/ai/*` endpoints, running agents and turning on agent AI review (they also need AI credits) |
        | `webhooks` | Webhook subscription endpoints |

        A scoped key is refused on other workspaces, on the admin panel, on API key management
        and on the app's built-in MCP endpoint (use `/mcp/postboost`). With `account_ids`, it may
        only name those accounts (in the URL, `accounts`, `account_ids` or post versions), cannot
        touch posts on other accounts, and `GET accounts` / `GET posts` only list matching items
        (pagination counts are computed before that filter). Workspace admins only, called with
        an unscoped key.
      operationId: createApiKey
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              name: Reporting agent
              abilities:
              - read
              account_ids:
              - 12
              - 14
              expires_at: 2027-01-31
            schema:
              $ref: '#/components/schemas/ApiKeyInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createApiKey_201_response'
          description: "The new key, with its plain token shown once"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/InsufficientScope'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Create a scoped API key
      tags:
      - Workspaces
  /{workspaceUuid}/api-keys/{apiKeyId}:
    delete:
      description: "Revokes a scoped key bound to this workspace. It stops working\
        \ at once. Workspace admins only, called with an unscoped key."
      operationId: deleteApiKey
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: The key's `id` from `GET api-keys`.
        explode: false
        in: path
        name: apiKeyId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/InsufficientScope'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Revoke a scoped API key
      tags:
      - Workspaces
  /{workspaceUuid}/media/base64:
    post:
      description: |
        Upload a file as base64 inside a JSON body, for agents and tools that cannot send multipart
        form data. The decoded file is checked exactly like `POST media` (allowed types and size
        limits; a PDF is accepted for LinkedIn document posts). Decoded size is capped at 20 MB; for
        larger files use remote upload by URL or chunked upload.
      operationId: uploadMediaBase64
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaBase64Input'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: Uploaded media object
      summary: Upload media (base64 JSON)
      tags:
      - Media
  /{workspaceUuid}/accounts/{accountUuid}/reconnect-links:
    post:
      description: |
        Creates a single-use link (valid 7 days) that lets someone without a PostBoost login, such as
        an agency's client, re-authorize this one account on its network. The link only refreshes the
        connection of this account; signing in as a different profile or page changes nothing.
        Workspace admins only. Available for Facebook Pages, Instagram, Threads, LinkedIn, TikTok,
        YouTube and Pinterest. Returns `404` while the feature is not enabled on this instance.
      operationId: createReconnectLink
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/accountUuid'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconnectLink'
          description: Link created. The URL is shown only once.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: "The caller is not a workspace admin, or not a member of the\
            \ workspace."
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: "Unknown account, or reconnect links are not enabled."
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: Reconnect links are not available for this account's network.
      summary: Create a reconnect link
      tags:
      - Accounts
  /{workspaceUuid}/accounts/connect-links:
    post:
      description: |
        Creates a single-use link (valid 15 minutes) to connect a new account on an OAuth network to this workspace: ask the user to open it in their browser while logged in to PostBoost, wait until they confirm, then call `list-accounts` to get the new account id.
        The link signs no one in: only the user who created it, while a workspace admin, can use it.
        Telegram, Discord and Slack need no browser: connect them with `connectChannel`. Mastodon,
        Pixelfed and Bluesky ask for a server or handle first, so the user connects them in the app.
        Workspace admins only; at most 10 links per minute.
      operationId: createConnectLink
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createConnectLink_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectLink'
          description: Link created. The URL is shown only once.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: Too many connect links in the last minute.
      summary: Create a connect link
      tags:
      - Accounts
  /{workspaceUuid}/usage/x:
    get:
      description: |
        The workspace's X posts this calendar month (UTC) against its monthly X allowance. Every thread
        part is one X post; a part with a link also counts as a link post. When the allowance is used
        up, scheduling to X is refused (`429`, `code: x_monthly_cap_reached`) and X posts that come due
        fail with "Monthly X allowance reached". Other networks are not affected. See the X policy in
        the developer docs.
      operationId: getXUsage
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
