        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get an agent run with its proposals
      tags:
      - Agents
  /{workspaceUuid}/agent-proposals:
    get:
      description: "Proposals of all agents in the workspace, newest first. Defaults\
        \ to `pending`."
      operationId: listAgentProposals
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: true
