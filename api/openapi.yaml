          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResult'
          description: Queue confirmation
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/PostConflict'
        "422":
          $ref: '#/components/responses/PostUnprocessable'
        "429":
          $ref: '#/components/responses/DailyCapReached'
      summary: Add post to queue
      tags:
      - Posts
