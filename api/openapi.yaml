      description: |
        Sends the draft to the network (optionally with an edited `body`). Ends as `sent`, or `failed` with
        `error`. Needs the `publish` ability; the API key that wrote the draft cannot approve it
        (`403`, `code: self_approval`). A draft is sent at most once: approving again returns `409`. Requires the inbox API to be enabled for the workspace (otherwise `404`). Admins and members only.
      operationId: approveInboxReplyDraft
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: The draft `id`.
        explode: false
        in: path
        name: draftId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxReplyDraftApprove'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createInboxReplyDraft_201_response'
          description: The reviewed draft
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/approveInboxReplyDraft_403_response'
          description: |
            Not allowed: not a workspace admin or member, a scoped key without the `publish` ability
            (`code: insufficient_scope`), or the key that wrote the draft (`code: self_approval`).
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: The draft was already reviewed.
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Approve and send a reply draft
      tags:
      - Inbox
      x-mcp-exclude: true
  /{workspaceUuid}/inbox/drafts/{draftId}/reject:
    post:
      description: |
        Rejects a pending draft; nothing is sent. Needs the `publish` ability. Requires the inbox API to be enabled for the workspace (otherwise `404`). Admins and members only.
      operationId: rejectInboxReplyDraft
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: The draft `id`.
        explode: false
        in: path
        name: draftId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createInboxReplyDraft_201_response'
          description: The rejected draft
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/InsufficientScope'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: The draft was already reviewed.
      summary: Reject a reply draft
      tags:
      - Inbox
      x-mcp-exclude: true
  /{workspaceUuid}/accounts/connect/{provider}:
    post:
      description: |
        Connects a channel that uses a bot token or a webhook URL instead of a login. The credentials
        are checked against the network first, stored encrypted and never returned. Connecting the same
        channel again updates it (`200`) instead of adding a second account. Workspace admins only;
        counts toward the plan's social account limit.

        - **telegram**: `bot_token` from @BotFather and `chat` (the channel's `@username`, or its
          numeric id such as `-1001234567890` for a private channel). The bot must be an administrator
          of the channel allowed to post messages.
        - **discord**: `webhook_url` from Channel settings → Integrations → Webhooks
          (`https://discord.com/api/webhooks/…`).
        - **slack**: `webhook_url` of an incoming webhook (`https://hooks.slack.com/services/…`) and an
          optional display `name`. Slack posts cannot be deleted from PostBoost, and images must be
          publicly reachable.

        Webhook URLs on any other host are refused (`422`) before any request is made.
      operationId: connectChannel
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: false
        in: path
        name: provider
        required: true
        schema:
          enum:
          - telegram
          - discord
          - slack
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectChannelInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelAccount'
          description: Channel connected.
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelAccount'
          description: The channel was already connected; its details and credentials
            were updated.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: "The caller is not a workspace admin, or the plan's social\
            \ account limit is reached."
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
          description: "Unknown provider, or the channel is switched off on this instance."
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: "Connect a Telegram, Discord or Slack channel"
      tags:
      - Accounts
  /{workspaceUuid}/recycling-rules:
    get:
      description: |
        Evergreen recycling rules of the workspace, newest first. A rule copies a post (or the least
        recently recycled published post with a tag) every `interval_days` and places the copy in the
        queue. Copies are ordinary posts: they show in the calendar and the queue.
      operationId: listRecyclingRules
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listRecyclingRules_200_response'
          description: The workspace's recycling rules
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List recycling rules
      tags:
      - Posts
    post:
      description: |
        Recycles one post (`post_uuid`) or a tag pool (`type: tag_pool` + `tag_uuid`) every
        `interval_days`. The first run is `start_at`, or one interval from now. Copies are never
        published immediately: `placement: queue` (default) takes each account's next free queue slot,
        `same_time` schedules at the source post's time of day, `draft` leaves a draft.

        Copies pass the same guardrails as posts created through the API (duplicate guard,
        per-account daily caps, disconnected accounts, X monthly allowance). A refused copy is not
        created; the run is logged with the guard's code (see the runs endpoint). X accounts are
        left out of copies because X rejects repeated text. Admins and members only.
      operationId: createRecyclingRule
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            example:
              post_uuid: 3f2b6c1e-8a4d-4f7e-9b2a-1c5d6e7f8a9b
              interval_days: 30
              max_runs: 6
              placement: queue
            schema:
              $ref: '#/components/schemas/RecyclingRuleInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRecyclingRule_201_response'
          description: The rule was created
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: Create a recycling rule
      tags:
      - Posts
  /{workspaceUuid}/recycling-rules/{ruleUuid}:
    delete:
      description: Deletes the rule and its run log. Copies it already created stay.
        Admins and members only.
      operationId: deleteRecyclingRule
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the recycling rule.
        explode: false
        in: path
        name: ruleUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          $ref: '#/components/responses/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Delete a recycling rule
      tags:
      - Posts
    get:
      operationId: getRecyclingRule
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the recycling rule.
        explode: false
        in: path
        name: ruleUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRecyclingRule_201_response'
          description: The rule
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get a recycling rule
      tags:
      - Posts
    parameters:
    - $ref: '#/components/parameters/workspaceUuid'
    - description: UUID of the recycling rule.
      explode: false
      in: path
      name: ruleUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: |
        Changes the interval, limit, placement or accounts, or pauses (`active: false`) and resumes
        the rule. Fields you leave out keep their value. A rule that reached `max_runs` resumes only
        with a higher `max_runs`. Admins and members only.
      operationId: updateRecyclingRule
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the recycling rule.
        explode: false
        in: path
        name: ruleUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              active: false
            schema:
              $ref: '#/components/schemas/RecyclingRuleUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRecyclingRule_201_response'
          description: The updated rule
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
      summary: "Update, pause or resume a recycling rule"
      tags:
      - Posts
  /{workspaceUuid}/recycling-rules/{ruleUuid}/runs:
    get:
      description: |
        The latest 100 runs of the rule, newest first: the copy each run created, or why it skipped
        (`source_unavailable`, `no_eligible_post`, `no_accounts`, `queue_full`,
        `x_skipped_identical_text`, or a guardrail code such as `duplicate_post` or
        `account_daily_cap_reached`).
      operationId: listRecyclingRuns
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - description: UUID of the recycling rule.
        explode: false
        in: path
        name: ruleUuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listRecyclingRuns_200_response'
          description: The rule's runs
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: List a recycling rule's runs
      tags:
      - Posts
  /{workspaceUuid}/posts/{postUuid}/recycle:
    post:
      description: |
        Shortcut for creating a `post` recycling rule for this post. Same body as
