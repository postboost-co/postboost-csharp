components:
  headers:
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier
        request with the same `Idempotency-Key`.
      explode: false
      schema:
        enum:
        - "true"
      style: simple
  parameters:
    IdempotencyKey:
      description: |
        Unique key (for example a UUID) that makes the request safe to retry. A repeat with the same key and
        body within 24 hours returns the stored response with `Idempotent-Replayed: true` and has no further
        effect. Keys are scoped to your user, the workspace, the method and the path.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 255
        minLength: 1
        type: string
      style: simple
    workspaceUuid:
      description: UUID of the workspace.
      explode: false
      in: path
      name: workspaceUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    accountUuid:
      description: UUID of the social media account.
      explode: false
      in: path
      name: accountUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    mediaUuid:
      description: UUID of the media asset.
      explode: false
      in: path
      name: mediaUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    tagUuid:
      description: UUID of the tag.
      explode: false
      in: path
      name: tagUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    postUuid:
      description: UUID of the post.
      explode: false
      in: path
      name: postUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    userId:
      description: ID of the user.
      explode: false
      in: path
      name: userId
      required: true
      schema:
        type: integer
      style: simple
    receiptUuid:
      description: UUID of the receipt.
      explode: false
      in: path
      name: receiptUuid
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    folderUuid:
