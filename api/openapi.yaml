  /{workspaceUuid}/posts:
    delete:
      description: Delete multiple posts at once.
      operationId: deletePostsBulk
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deletePostsBulk_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
          description: Deletion result
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: Delete posts (bulk)
      tags:
      - Posts
    get:
      description: Returns a paginated list of posts in the workspace.
      operationId: listPosts
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPosts_200_response'
          description: Paginated list of posts
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
      summary: List posts
      tags:
      - Posts
    post:
      description: |
        Create a new post. Use `schedule: true` with `date` and `time` to schedule,
        `schedule_now: true` to publish immediately, or `queue: true` to add to the
        smart publishing queue (each account gets its own queue slot).

        `date`, `time` and `accounts_schedule` are read in `timezone` when given,
        otherwise in the workspace timezone. Use `accounts_schedule` to give individual
        accounts their own departure time.

        Post bodies may reference mentions with `{{mention:<reference>}}` (see the
        Mentions endpoints). When the post is scheduled, provider requirements (for example
        a network that requires media) are validated up front and reported as `422`.

        **First comment and threads.** A version's `content` is an ordered array. Item 0 is
        the post. Add a second item to publish a first comment on Facebook Page, Instagram and
        LinkedIn, or to continue a thread on X, Threads, Bluesky, Mastodon and Pixelfed:

        ```json
        {
          "accounts": [12],
          "schedule_now": true,
          "versions": [{
            "account_id": 0,
            "is_original": true,
            "content": [
              { "body": "Our API 1.8 is live.", "media": [345] },
              { "body": "Full changelog: https://postboost.co/docs/changelog/" }
            ]
          }]
        }
        ```

        The comment is posted right after the post goes live. If the comment fails, the post
        stays published and the account's entry on the post reports the error.
      operationId: createPost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPost_201_response'
          description: Created post. `warnings` lists non-blocking problems (see PostWarning);
            the key is absent when there are none.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        "400":
          $ref: '#/components/responses/InvalidIdempotencyKey'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "409":
          $ref: '#/components/responses/PostConflict'
        "422":
          $ref: '#/components/responses/PostUnprocessable'
        "429":
          $ref: '#/components/responses/DailyCapReached'
      summary: Create post
      tags:
      - Posts
  /{workspaceUuid}/posts/{postUuid}:
    delete:
      description: Deletes a post. Use `delete_mode` to control whether to also remove
        the published content from social platforms.
      operationId: deletePost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/postUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deletePost_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
          description: Deletion result
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Delete post
      tags:
      - Posts
    get:
      description: Returns a single post with all its versions and associated accounts.
      operationId: getPost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/postUuid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          description: Post details
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get post
      tags:
      - Posts
    put:
      description: |
        Replaces a post's versions, accounts, tags, and scheduling options. The post must not be in a published state.
        `timezone` is honoured: `date`, `time` and `accounts_schedule` are read in it. When the post stays
        scheduled, provider requirements are validated and reported as `422`.
      operationId: updatePost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/postUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePost_200_response'
          description: Post updated. `warnings` lists non-blocking problems (see PostWarning);
            the key is absent when there are none.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/PostConflict'
        "422":
          $ref: '#/components/responses/PostUnprocessable'
        "429":
          $ref: '#/components/responses/DailyCapReached'
      summary: Update post
      tags:
      - Posts
  /{workspaceUuid}/posts/schedule/{postUuid}:
    post:
      description: |
        Schedule an existing post. Optionally move it with `date`/`time` (read in `timezone`) and give
        accounts their own times with `accounts_schedule`. Set `postNow: true` to publish immediately;
        publishing starts within the request and any per-account times are dropped.
        Provider requirements are validated and reported as `422`. The guardrails check the saved post at
        the time it would publish, as on create: `409` duplicate (override with `X-Allow-Duplicate: true`),
        `422` account cannot publish, `429` daily or X cap.
      operationId: schedulePost
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/postUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schedulePost_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResult'
          description: Schedule confirmation
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/WorkspaceForbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/PostConflict'
        "422":
          $ref: '#/components/responses/PostUnprocessable'
        "429":
          $ref: '#/components/responses/DailyCapReached'
      summary: Schedule post
      tags:
      - Posts
  /{workspaceUuid}/posts/add-to-queue/{postUuid}:
    post:
      description: |
        Add an existing post to the smart publishing queue. Each account of the post gets its own
        next free queue slot. Returns `422` when the post has no accounts, the posting schedule has no
        available times, or provider requirements are not met. The guardrails check the saved post as
        publishing at the queue slot it will get (the earliest next free slot of its accounts), as on
        create: `409` duplicate (override with `X-Allow-Duplicate: true`), `422` account cannot publish,
        `429` daily cap on that slot's UTC day or X cap.
      operationId: addPostToQueue
      parameters:
      - $ref: '#/components/parameters/workspaceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/postUuid'
      requestBody:
        content:
