name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API tokens. Security issues go to security@postboost.co, not here."
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.8.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Language / runtime version
      placeholder: "Python 3.12, Node 22, PHP 8.3, ..."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Minimal code to reproduce, the request ID or error message, and what you expected.
    validations:
      required: true
